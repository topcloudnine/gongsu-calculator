<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공수계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: "#0f2a4a",
              ink: "#172033",
              line: "#d8e0ea",
              mist: "#f5f8fb"
            },
            boxShadow: {
              soft: "0 18px 42px rgba(15, 42, 74, 0.08)"
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-white text-ink antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useMemo, useState } = React;

      const roles = [
        { id: "planner", label: "기획자", initialHours: 80 },
        { id: "designer", label: "디자이너", initialHours: 160 },
        { id: "publisher", label: "퍼블리셔", initialHours: 0 },
        { id: "developer", label: "개발자", initialHours: 240 },
        { id: "etc", label: "기타", initialHours: 0 }
      ];

      const inputBase =
        "w-full rounded-lg border border-line bg-white px-4 py-3 text-sm text-ink outline-none transition focus:border-navy focus:ring-4 focus:ring-navy/10";

      function numberValue(value) {
        return Math.max(Number(value) || 0, 0);
      }

      function formatNumber(value, digits = 1) {
        return value.toLocaleString("ko-KR", {
          minimumFractionDigits: 0,
          maximumFractionDigits: digits
        });
      }

      function formatHours(value) {
        return `${formatNumber(value, 1)}h`;
      }

      function formatMM(value) {
        return `${formatNumber(value, 2)}MM`;
      }

      function formatPercent(value) {
        return `${formatNumber(value, 1)}%`;
      }

      function NumberField({ id, label, value, min = 0, suffix, onChange }) {
        return (
          <div>
            <label htmlFor={id} className="mb-2 block text-sm font-semibold text-ink">
              {label}
            </label>
            <div className="relative">
              <input
                id={id}
                name={id}
                className={`${inputBase} ${suffix ? "pr-16" : ""}`}
                type="number"
                min={min}
                autoComplete="off"
                value={value}
                onChange={(event) => onChange(event.target.value)}
              />
              {suffix && (
                <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">
                  {suffix}
                </span>
              )}
            </div>
          </div>
        );
      }

      function MetricCard({ label, value, note, tone = "default" }) {
        return (
          <div
            className={`rounded-lg border p-5 ${
              tone === "primary"
                ? "border-navy bg-navy text-white"
                : "border-line bg-white"
            }`}
          >
            <p
              className={`text-sm font-semibold ${
                tone === "primary" ? "text-white/75" : "text-slate-500"
              }`}
            >
              {label}
            </p>
            <p className="mt-2 text-3xl font-extrabold tracking-normal">
              {value}
            </p>
            {note && (
              <p
                className={`mt-2 text-sm ${
                  tone === "primary" ? "text-white/70" : "text-slate-500"
                }`}
              >
                {note}
              </p>
            )}
          </div>
        );
      }

      function RoleInput({ role, value, onChange }) {
        return (
          <NumberField
            id={`${role.id}-hours`}
            label={`${role.label} 작업 시간`}
            value={value}
            suffix="h"
            onChange={(nextValue) => onChange(role.id, nextValue)}
          />
        );
      }

      function RoleResultRow({ role }) {
        return (
          <div className="rounded-lg border border-line bg-white p-4">
            <div className="grid gap-3 sm:grid-cols-[1fr_120px_120px_110px] sm:items-center">
              <div>
                <p className="text-sm font-extrabold text-ink">{role.label}</p>
                <p className="mt-1 text-xs font-semibold text-slate-500">
                  역할별 작업 시간
                </p>
              </div>
              <div className="text-left sm:text-right">
                <p className="text-xs font-semibold text-slate-500">작업 시간</p>
                <p className="mt-1 text-base font-extrabold text-ink">
                  {formatHours(role.hours)}
                </p>
              </div>
              <div className="text-left sm:text-right">
                <p className="text-xs font-semibold text-slate-500">역할별 MM</p>
                <p className="mt-1 text-base font-extrabold text-navy">
                  {formatMM(role.mm)}
                </p>
              </div>
              <div className="text-left sm:text-right">
                <p className="text-xs font-semibold text-slate-500">비중</p>
                <p className="mt-1 text-base font-extrabold text-ink">
                  {formatPercent(role.percent)}
                </p>
              </div>
            </div>
            <div className="mt-4 h-2 overflow-hidden rounded-full bg-mist">
              <div
                className="h-full rounded-full bg-navy transition-all"
                style={{ width: `${Math.min(role.percent, 100)}%` }}
              ></div>
            </div>
          </div>
        );
      }

      function App() {
        const [mmStandardHours, setMmStandardHours] = useState(160);
        const [roleHours, setRoleHours] = useState(
          roles.reduce((acc, role) => ({ ...acc, [role.id]: role.initialHours }), {})
        );

        const result = useMemo(() => {
          const standardHours = Math.max(numberValue(mmStandardHours), 0.1);
          const roleResults = roles.map((role) => {
            const hours = numberValue(roleHours[role.id]);
            return {
              ...role,
              hours,
              mm: hours / standardHours
            };
          });
          const totalHours = roleResults.reduce((sum, role) => sum + role.hours, 0);
          const totalMM = totalHours / standardHours;
          const rolesWithPercent = roleResults.map((role) => ({
            ...role,
            percent: totalHours > 0 ? (role.hours / totalHours) * 100 : 0
          }));
          const topRole = rolesWithPercent.reduce(
            (top, role) => (role.hours > top.hours ? role : top),
            rolesWithPercent[0]
          );

          return {
            standardHours,
            totalHours,
            totalMM,
            roleResults: rolesWithPercent,
            topRole
          };
        }, [mmStandardHours, roleHours]);

        function updateRoleHours(roleId, value) {
          setRoleHours((current) => ({ ...current, [roleId]: value }));
        }

        return (
          <main className="min-h-screen bg-white">
            <section className="border-b border-line bg-mist">
              <div className="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-8 sm:px-8 lg:flex-row lg:items-end lg:justify-between lg:py-10">
                <div>
                  <p className="text-sm font-bold text-navy">KOREAN AGENCY DASHBOARD</p>
                  <h1 className="mt-2 text-3xl font-extrabold tracking-normal text-ink sm:text-4xl">
                    공수계산기
                  </h1>
                  <p className="mt-3 max-w-2xl text-base leading-7 text-slate-600">
                    실제 작업 시간을 역할별로 입력해 MM, 총 작업 시간, 역할별 비중을 계산합니다.
                  </p>
                </div>
                <div className="rounded-lg border border-line bg-white px-4 py-3 text-sm font-semibold text-navy shadow-sm">
                  1MM = {formatHours(result.standardHours)}
                </div>
              </div>
            </section>

            <section className="mx-auto grid max-w-7xl gap-6 px-5 py-6 sm:px-8 lg:grid-cols-[390px_1fr] lg:py-8">
              <form className="rounded-lg border border-line bg-white p-5 shadow-soft sm:p-6">
                <div className="mb-6">
                  <h2 className="text-lg font-bold text-ink">작업 시간 입력</h2>
                  <p className="mt-1 text-sm text-slate-500">
                    역할별 실제 작업 시간을 입력하면 MM과 비중이 즉시 업데이트됩니다.
                  </p>
                </div>

                <div className="space-y-5">
                  <NumberField
                    id="mm-standard-hours"
                    label="1MM 기준 시간"
                    value={mmStandardHours}
                    min={0.1}
                    suffix="h"
                    onChange={setMmStandardHours}
                  />

                  <div className="h-px bg-line"></div>

                  {roles.map((role) => (
                    <RoleInput
                      key={role.id}
                      role={role}
                      value={roleHours[role.id]}
                      onChange={updateRoleHours}
                    />
                  ))}
                </div>
              </form>

              <div className="space-y-6">
                <div className="grid gap-4 md:grid-cols-3">
                  <MetricCard
                    label="총 작업 시간"
                    value={formatHours(result.totalHours)}
                    note="모든 역할 작업 시간 합계"
                  />
                  <MetricCard
                    label="총 MM"
                    value={formatMM(result.totalMM)}
                    note={`${formatHours(result.totalHours)} / ${formatHours(result.standardHours)}`}
                    tone="primary"
                  />
                  <MetricCard
                    label="가장 많이 투입된 역할"
                    value={result.topRole?.hours > 0 ? result.topRole.label : "-"}
                    note={
                      result.topRole?.hours > 0
                        ? `${formatHours(result.topRole.hours)} · ${formatPercent(result.topRole.percent)}`
                        : "작업 시간을 입력하세요"
                    }
                  />
                </div>

                <div className="rounded-lg border border-line bg-white p-5 shadow-soft sm:p-6">
                  <div className="mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                    <div>
                      <h2 className="text-lg font-bold text-ink">역할별 MM 분석</h2>
                      <p className="mt-1 text-sm text-slate-500">
                        역할별 작업 시간, MM, 전체 비중을 함께 확인합니다.
                      </p>
                    </div>
                    <div className="w-fit rounded-lg bg-mist px-3 py-2 text-sm font-bold text-navy">
                      총 {formatMM(result.totalMM)}
                    </div>
                  </div>

                  <div className="space-y-3">
                    {result.roleResults.map((role) => (
                      <RoleResultRow key={role.id} role={role} />
                    ))}
                  </div>
                </div>

                <div className="rounded-lg border border-line bg-mist p-5">
                  <div className="grid gap-4 text-sm sm:grid-cols-3">
                    <div>
                      <p className="font-semibold text-slate-500">계산식</p>
                      <p className="mt-1 text-lg font-extrabold text-ink">
                        작업 시간 / 1MM 기준 시간
                      </p>
                    </div>
                    <div>
                      <p className="font-semibold text-slate-500">예시 기준</p>
                      <p className="mt-1 text-lg font-extrabold text-ink">
                        160h = 1.0MM
                      </p>
                    </div>
                    <div>
                      <p className="font-semibold text-slate-500">현재 총합</p>
                      <p className="mt-1 text-lg font-extrabold text-ink">
                        {formatHours(result.totalHours)} = {formatMM(result.totalMM)}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
